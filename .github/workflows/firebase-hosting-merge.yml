name: Deploy to Firebase Hosting (live)

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Sentry error monitoring: set the DSN as a repository variable (Settings → Secrets and
          # variables → Actions → Variables → SENTRY_DSN). Without it, monitoring stays off.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: pianotrainer-8e3da
